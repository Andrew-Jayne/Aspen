name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - run: pnpm install

      - run: pnpm build

      - run: pnpm pack --pack-destination dist

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/aspen.min.js
            dist/aspen.ts
            dist/*.tgz
          generate_release_notes: true
